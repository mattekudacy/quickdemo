<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sambit — voice budget tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="dot"></span>Sambit</div>
    <div id="month" class="muted"></div>
  </header>

  <section class="card add">
    <h2>Quick add</h2>
    <form id="form">
      <button type="button" id="mic" class="mic" aria-label="Log expense by voice">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <input id="text" autocomplete="off" placeholder="Say or type an expense">
      <button class="btn">Add</button>
    </form>
    <div id="preview" class="preview muted">Tap the mic and speak, or type a sentence.</div>
  </section>

  <section class="card total">
    <div class="muted">Spent this month</div>
    <div id="total" class="big"></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="row muted"><span id="pct"></span><button id="budgetBtn" class="link"></button></div>
  </section>

  <section class="card cats">
    <h2>By category</h2>
    <div id="chart"></div>
  </section>

  <section class="card recent">
    <h2>Recent transactions</h2>
    <ul id="list"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>

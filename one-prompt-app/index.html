<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sambit — voice budget tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="scroll" id="scroll">
    <section class="view" id="v-home"></section>
    <section class="view" id="v-wallet"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-history"></section>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="toast" id="toast"></div>
  <div class="dim" id="dim"></div>
  <form class="sheet" id="form">
    <div class="grab"></div>
    <h2>Quick add</h2>
    <div class="line">
      <button type="button" id="mic" class="mic" aria-label="Log by voice"></button>
      <input id="text" autocomplete="off" placeholder="Say or type an expense">
    </div>
    <div id="preview" class="preview muted">Tap the mic and speak, or type a sentence.</div>
    <div class="line"><select id="acct"></select><button class="btn">Add</button></div>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
